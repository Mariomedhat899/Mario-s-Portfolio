<nav class="nav" [attr.data-theme]="theme()">
  <div class="nav-inner">
    <a class="logo" href="#top"><b>mm</b>://medhat</a>

    <!-- Desktop nav links -->
    <div class="nav-links desktop-only">
      <a href="#work" (click)="closeMobileMenu()">work</a>
      <a href="#stack" (click)="closeMobileMenu()">stack</a>
      <a href="#contact" (click)="closeMobileMenu()">contact</a>
    </div>

    <div class="uptime desktop-only">
      <span class="dot"></span>
      <span>{{ uptime() }}</span>
    </div>

    <button class="theme-btn" (click)="onThemeClick()" aria-label="Toggle color theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <!-- Mobile hamburger -->
    <button class="mobile-menu-btn" (click)="toggleMobileMenu()" aria-label="Toggle menu" [attr.aria-expanded]="mobileMenuOpen()">
      @if (!mobileMenuOpen()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      }
    </button>
  </div>

  <!-- Scroll progress bar -->
  <div class="scroll-progress" style="width: {{ scrollProgress() * 100 }}%"></div>

  <!-- Navigation dots -->
  <div class="nav-dots" aria-label="Section navigation">
    @for (label of sectionLabels; track label; let i = $index) {
      <button
        class="nav-dot"
        [class.active]="activeSection() === i"
        (click)="scrollToSection(i)"
        [attr.aria-label]="label"
        [attr.aria-current]="activeSection() === i ? 'true' : 'false'">
        <span class="dot-inner"></span>
        <span class="dot-label">{{ label }}</span>
      </button>
    }
  </div>

  <!-- Mobile menu panel -->
  @if (mobileMenuOpen()) {
    <div class="mobile-menu" [class.open]="true">
      <a href="#work" (click)="closeMobileMenu()">work</a>
      <a href="#stack" (click)="closeMobileMenu()">stack</a>
      <a href="#contact" (click)="closeMobileMenu()">contact</a>
      <div class="mobile-divider"></div>
      <div class="mobile-uptime">
        <span class="dot"></span>
        <span>{{ uptime() }}</span>
      </div>
    </div>
  }
</nav>
