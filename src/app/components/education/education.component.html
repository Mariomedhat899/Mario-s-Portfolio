<section class="block" id="edu" style="padding-top:20px">
  <div class="wrap">
    <div class="sec-head reveal">
      <div>
        <div class="eyebrow">// initialization</div>
        <h2>Training & languages</h2>
      </div>
    </div>
    <div class="edu-grid">
      <div class="edu-card reveal">
        <div class="k">education</div>
        <h3>Full Stack Web Development Diploma</h3>
        <p>Route IT Training · Remote<br>Sep 2024 – Nov 2025</p>
      </div>
      <div class="edu-card reveal">
        <div class="k">certifications</div>
        <h3>Microsoft Certified: Azure Fundamentals (AZ-900)</h3>
        <p>Microsoft · 2025</p>
      </div>
      <div class="edu-card reveal" id="langCard" [class.in-view]="inView()">
        <div class="k">languages</div>
        <div class="lang-meter">
          <div>
            <div class="fact-row" style="justify-content:space-between;margin-bottom:6px"><b>Arabic</b><span style="color:var(--faint)">native</span></div>
            <div class="bar"><div class="fill ar"></div></div>
          </div>
          <div>
            <div class="fact-row" style="justify-content:space-between;margin-bottom:6px"><b>English</b><span style="color:var(--faint)">professional</span></div>
            <div class="bar"><div class="fill en"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
