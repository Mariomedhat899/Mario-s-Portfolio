  <style>
    /* ==========================================================================
       PRELOADER — inline & render-blocking-free so it paints before the
       Angular bundle even finishes downloading. Colors mirror the site's
       dark-first tokens (styles.scss) with hard fallbacks so it looks right
       even before the global stylesheet has applied.
       ========================================================================== */
    html.preload-lock, html.preload-lock body { overflow: hidden !important; height: 100%; }

    #app-preloader {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: var(--ground, #0a0907);
      font-family: "JetBrains Mono", ui-monospace, "Cascadia Code", monospace;
      opacity: 1;
      transition: opacity .6s cubic-bezier(.16,.84,.3,1), visibility .6s;
    }
    #app-preloader.pl-hide { opacity: 0; pointer-events: none; }

    #app-preloader .pl-inner {
      width: min(420px, 86vw);
      display: flex; flex-direction: column; align-items: center;
      transform: translateY(0);
    }

    #app-preloader .pl-logo {
      font-family: "Syne", "JetBrains Mono", sans-serif;
      font-weight: 800; font-size: 1.6rem; letter-spacing: -0.01em;
      color: var(--text, #f5efe3);
      margin-bottom: 6px;
      display: flex; align-items: center; gap: 8px;
    }
    #app-preloader .pl-logo .dot { color: var(--accent, #c86b3e); }
    #app-preloader .pl-logo .pl-here {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--ok, #8ab882); box-shadow: 0 0 10px var(--ok, #8ab882);
      animation: pl-pulse 1.6s ease-in-out infinite;
    }
    @keyframes pl-pulse {
      0%, 100% { transform: scale(1); opacity: .75; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    #app-preloader .pl-sub {
      font-size: .66rem; letter-spacing: .18em; text-transform: uppercase;
      color: var(--faint, #8a7c6c); margin-bottom: 26px;
    }

    #app-preloader .pl-term {
      width: 100%;
      border: 1px solid var(--line, #2e261d); border-radius: 12px;
      background: color-mix(in srgb, var(--panel, #13100c) 92%, transparent);
      box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 6px 20px rgba(0,0,0,.4);
      overflow: hidden;
    }
    #app-preloader .pl-bar-top {
      display: flex; align-items: center; gap: 7px; padding: 10px 14px;
      border-bottom: 1px solid var(--line-soft, #231c14); background: var(--panel-2, #1a1510);
    }
    #app-preloader .pl-bar-top i { width: 9px; height: 9px; border-radius: 50%; display: block; }
    #app-preloader .pl-bar-top i:nth-child(1) { background: var(--err, #c97368); }
    #app-preloader .pl-bar-top i:nth-child(2) { background: var(--accent, #c86b3e); }
    #app-preloader .pl-bar-top i:nth-child(3) { background: var(--ok, #8ab882); }
    #app-preloader .pl-bar-top span {
      margin-left: auto; font-size: .6rem; letter-spacing: .1em; color: var(--faint, #8a7c6c);
    }

    #app-preloader .pl-body {
      padding: 16px 18px; font-size: .74rem; line-height: 1.85;
      min-height: 128px;
    }
    #app-preloader .pl-ln { white-space: pre-wrap; word-break: break-word; }
    #app-preloader .pl-ln.t-prompt { color: var(--accent, #c86b3e); }
    #app-preloader .pl-ln.t-info { color: var(--muted, #b8a992); }
    #app-preloader .pl-ln.t-data { color: var(--data, #6ec4d1); }
    #app-preloader .pl-ln.t-ok { color: var(--ok, #8ab882); }

    #app-preloader .pl-caret {
      display: inline-block; width: 7px; height: 1em; margin-left: 2px;
      background: var(--accent, #c86b3e); vertical-align: -.1em;
      animation: pl-blink 1.1s steps(1) infinite;
    }
    @keyframes pl-blink { 50% { opacity: 0; } }

    #app-preloader .pl-progress-row {
      display: flex; align-items: center; gap: 12px;
      padding: 0 18px 16px;
    }
    #app-preloader .pl-track {
      flex: 1; height: 3px; border-radius: 3px; overflow: hidden;
      background: var(--line-soft, #231c14);
    }
    #app-preloader .pl-fill {
      height: 100%; width: 0%; border-radius: 3px;
      background: linear-gradient(90deg, var(--accent, #c86b3e), var(--data, #6ec4d1));
      transition: width .25s linear;
    }
    #app-preloader .pl-pct {
      font-size: .66rem; letter-spacing: .05em; color: var(--faint, #8a7c6c);
      min-width: 34px; text-align: right;
    }

    @media (max-width: 480px) {
      #app-preloader .pl-body { font-size: .68rem; min-height: 150px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-preloader, #app-preloader .pl-fill { transition: opacity .01s linear !important; }
      #app-preloader .pl-here, #app-preloader .pl-caret { animation: none !important; }
    }

<body>
  <!-- Pre-bootstrap preloader: static markup, paints before the Angular bundle loads -->
  <div id="app-preloader" role="status" aria-live="polite" aria-label="Loading site">
    <div class="pl-inner">
      <div class="pl-logo"><span class="pl-here"></span>Mario Medhat<span class="dot">.</span>dev</div>
      <div class="pl-sub">booting portfolio</div>
      <div class="pl-term">
        <div class="pl-bar-top"><i></i><i></i><i></i><span>boot.sh</span></div>
        <div class="pl-body" id="pl-lines"></div>
        <div class="pl-progress-row">
          <div class="pl-track"><div class="pl-fill" id="pl-bar"></div></div>
          <div class="pl-pct" id="pl-pct">0%</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var MIN_MS = 2800;
      var start = Date.now();
      var root = document.documentElement;
      root.classList.add('preload-lock');

      var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      var linesEl = document.getElementById('pl-lines');
      var barEl = document.getElementById('pl-bar');
      var pctEl = document.getElementById('pl-pct');

      var script = [
        { text: '\u279c ~ init --portfolio', cls: 't-prompt', type: true },
        { text: '[1/4] loading modules \u2714',        cls: 't-info' },
        { text: '[2/4] compiling styles.scss \u2714',   cls: 't-info' },
        { text: '[3/4] mounting components \u2714',     cls: 't-data' },
        { text: '[4/4] rendering UI \u2714',             cls: 't-data' },
        { text: 'ready \u00b7 status 200',              cls: 't-ok' }
      ];
      var idx = 0;

      function trim() {
        while (linesEl.children.length > 6) linesEl.removeChild(linesEl.firstChild);
      }

      function typeNext() {
        if (idx >= script.length) {
          var caret = document.createElement('span');
          caret.className = 'pl-caret';
          if (linesEl.lastChild) linesEl.lastChild.appendChild(caret);
          return;
        }
        var step = script[idx++];
        var div = document.createElement('div');
        div.className = 'pl-ln ' + step.cls;
        linesEl.appendChild(div);
        trim();

        if (reduceMotion || !step.type) {
          div.textContent = step.text;
          setTimeout(typeNext, reduceMotion ? 40 : 260);
          return;
        }
        var i = 0;
        var iv = setInterval(function () {
          div.textContent = step.text.slice(0, ++i);
          if (i >= step.text.length) {
            clearInterval(iv);
            setTimeout(typeNext, 220);
          }
        }, 22);
      }
      typeNext();

      function tick() {
        var elapsed = Date.now() - start;
        var pct = Math.min(92, Math.round((elapsed / MIN_MS) * 92));
        if (barEl) barEl.style.width = pct + '%';
        if (pctEl) pctEl.textContent = pct + '%';
        if (!window.__preloadDone) requestAnimationFrame(tick);
      }
      if (!reduceMotion) {
        requestAnimationFrame(tick);
      } else if (barEl && pctEl) {
        barEl.style.width = '92%';
        pctEl.textContent = '92%';
      }

      // Exposed for the Angular app to call once it has actually bootstrapped
      // and rendered — enforces the 2.8s floor regardless of how fast that is.
      window.hidePreloader = function () {
        if (window.__preloadHiding) return;
        window.__preloadHiding = true;
        var elapsed = Date.now() - start;
        var wait = Math.max(0, MIN_MS - elapsed);
        setTimeout(function () {
          window.__preloadDone = true;
          if (barEl) barEl.style.width = '100%';
          if (pctEl) pctEl.textContent = '100%';
          setTimeout(function () {
            var el = document.getElementById('app-preloader');
            if (!el) return;
            el.classList.add('pl-hide');
            root.classList.remove('preload-lock');
            setTimeout(function () {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }, reduceMotion ? 50 : 650);
          }, reduceMotion ? 30 : 200);
        }, wait);
      };

      // Safety net: never let a stuck bootstrap block the site forever.
      setTimeout(function () {
        if (!window.__preloadHiding) window.hidePreloader();
      }, 12000);
    })();
  </script>

  <app-root></app-root>
</body>
